<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gökyüzü SF</title>
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1622; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    /* phones (src/app/main.js): no backdrop blur. Every HUD panel re-blurred the moving 3D view on every frame: about
       two thirds of the compositor's work in flight (17 blurred panels on a phone screen). The panels keep their tint. */
    html.gk-noblur *, html.gk-noblur *::before, html.gk-noblur *::after { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="ui"></div>
  <script type="module" src="./src/app/main.js"></script>
</body>
</html>
