# Unit tests on every push and pull request. The built game files (assets/, renders/) are not in git: the checks that
# need them print SKIP lines and pass (tools/README.md, section 2).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # the tests need no browser
    steps:
      # actions pinned to full commit SHAs (a tag can be moved; a commit cannot); Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # the tests never push: no token left in .git/config for later steps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install (npm ci when a lockfile exists)
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: tests/*.test.mjs
        run: |
          failed=""
          for t in tests/*.test.mjs; do
            echo "::group::$t"
            node "$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi
          echo "all test files passed"
