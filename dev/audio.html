<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Ses laboratuvarı</title>
  <style>
    html, body { margin: 0; background: #141b22; color: #d8e0e8; font: 12px -apple-system, system-ui, sans-serif; }
    #wrap { display: grid; grid-template-columns: 360px 1fr; gap: 10px; padding: 10px; }
    fieldset { border: 1px solid #2c3a48; border-radius: 6px; margin: 0 0 8px; padding: 6px 8px; }
    legend { color: #8fb4d8; }
    label.s { display: grid; grid-template-columns: 92px 1fr 48px; align-items: center; gap: 6px; margin: 2px 0; }
    label.c { display: inline-flex; gap: 4px; margin: 2px 8px 2px 0; align-items: center; }
    input[type=range] { width: 100%; }
    button { background: #22364a; color: #dfe9f3; border: 1px solid #3a5670; border-radius: 4px; padding: 3px 7px; margin: 2px; cursor: pointer; }
    button:hover { background: #2d4862; }
    button.on { background: #6a3d1f; border-color: #c07a3a; }
    #spec { width: 100%; height: 220px; background: #0b1016; border-radius: 6px; display: block; }
    #meter { font: 13px ui-monospace, monospace; margin: 6px 0; }
    #dbg { font: 11px ui-monospace, monospace; white-space: pre; background: #0d1318; padding: 6px; border-radius: 6px; max-height: 60vh; overflow: auto; }
    .row { display: flex; flex-wrap: wrap; align-items: center; }
    select { background: #22364a; color: #dfe9f3; border: 1px solid #3a5670; border-radius: 4px; padding: 2px; }
  </style>
  <script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<div id="wrap">
  <div id="left">
    <fieldset><legend>Uçak / görünüm</legend>
      <div class="row">
        <button id="start">▶ Sesi başlat</button>
        <select id="ac"><option>f16</option><option>f22</option><option>a320neo</option><option>b737</option><option>uh60</option></select>
        <select id="cam"><option value="cockpit">kokpit</option><option value="chase" selected>takip</option><option value="static">sabit (geçiş)</option></select>
        <label class="c"><input type="checkbox" id="mute" />sessiz</label>
        <label class="c"><input type="checkbox" id="pause" />duraklat</label>
      </div>
      <label class="s">mesafe m<input type="range" id="dist" min="5" max="3000" value="30" /><span></span></label>
      <label class="s">açı ° (0=ön)<input type="range" id="azim" min="0" max="360" value="180" /><span></span></label>
    </fieldset>
    <fieldset><legend>Motor / uçuş</legend>
      <label class="s">gaz kolu<input type="range" id="n1" min="0" max="1" step="0.01" value="0" /><span></span></label>
      <label class="s">art yakıcı<input type="range" id="ab" min="0" max="1" step="0.01" value="0" /><span></span></label>
      <label class="s">ters itki<input type="range" id="rev" min="0" max="1" step="0.01" value="0" /><span></span></label>
      <label class="s">hız m/s<input type="range" id="tas" min="0" max="700" step="1" value="0" /><span></span></label>
      <label class="s">irtifa AGL m<input type="range" id="agl" min="0" max="3000" step="1" value="0" /><span></span></label>
      <label class="s">dikey hız<input type="range" id="vs" min="-30" max="30" step="0.1" value="0" /><span></span></label>
      <label class="s">G<input type="range" id="g" min="-2" max="10" step="0.1" value="1" /><span></span></label>
      <label class="s">rotor RPM<input type="range" id="rotor" min="0" max="1.05" step="0.01" value="1" /><span></span></label>
      <label class="s">kolektif<input type="range" id="coll" min="0" max="1" step="0.01" value="0.4" /><span></span></label>
      <label class="c"><input type="checkbox" id="ground" checked />yerde</label>
      <label class="c"><input type="checkbox" id="spool" checked />motor gecikmesi</label>
      <label class="c"><input type="checkbox" id="ap" />otopilot</label>
      <label class="c"><input type="checkbox" id="crash" />kaza</label>
    </fieldset>
    <fieldset><legend>Sistemler</legend>
      <label class="s">iniş takımı<input type="range" id="gear" min="0" max="1" step="0.01" value="1" /><span></span></label>
      <label class="s">flap<input type="range" id="flaps" min="0" max="1" step="0.01" value="0" /><span></span></label>
      <label class="s">hava freni<input type="range" id="sb" min="0" max="1" step="0.01" value="0" /><span></span></label>
      <label class="s">spoiler<input type="range" id="spoil" min="0" max="1" step="0.01" value="0" /><span></span></label>
      <label class="s">fren<input type="range" id="brake" min="0" max="1" step="0.01" value="0" /><span></span></label>
      <label class="s">kanopi<input type="range" id="canopy" min="0" max="1" step="0.01" value="0" /><span></span></label>
      <div class="row"><button id="gearCycle">takım çevrimi</button><button id="flapStep">flap +</button><button id="flapUp">flap 0</button><button id="canopyCycle">kanopi çevrimi</button></div>
    </fieldset>
    <fieldset><legend>Uyarılar</legend>
      <div class="row" id="warn"></div>
    </fieldset>
    <fieldset><legend>Senaryolar</legend>
      <div class="row">
        <button id="scTakeoff">kalkış</button><button id="scApproach">yaklaşma + iniş</button><button id="scFlyby">alçak geçiş</button>
        <button id="scSuper">süpersonik geçiş</button><button id="scAB">AB patlaması</button><button id="scStop">dur</button>
      </div>
    </fieldset>
    <fieldset><legend>Tek seferlik</legend><div class="row" id="shots"></div></fieldset>
  </div>
  <div>
    <canvas id="spec" width="1400" height="220"></canvas>
    <div id="meter"></div>
    <div id="dbg"></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { createAudioSystem } from '../src/audio/index.js';

const $ = (id) => document.getElementById(id);
const camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.3, 80000);
const scene = new THREE.Scene();
const plane = new THREE.Object3D(); scene.add(plane); scene.add(camera);
const audio = createAudioSystem({ camera });
window.__audio = audio;

// ---- fake flight model (FlightModel readable state) ----
const flight = {
  spec: { flapDetents: [{ label: 'UP' }, { label: '1' }, { label: '2' }, { label: '3' }, { label: 'FULL' }] },
  position: new THREE.Vector3(), quaternion: new THREE.Quaternion(), velocity: new THREE.Vector3(),
  airspeed: 0, ias: 0, mach: 0, altitude: 0, agl: 0, verticalSpeed: 0, gForce: 1, throttle: 0, onGround: true, crashed: false,
  engines: [{ n1: 0.2, thrust: 0, afterburner: 0 }, { n1: 0.2, thrust: 0, afterburner: 0 }],
  gear: 1, flaps: 0, flapsIndex: 0, spoilers: 0, speedbrake: 0, reverser: 0, brakes: 0, fuel: 1000,
  warnings: { stall: false, overspeed: false, gear: false, bank: false, sinkRate: false, pullUp: false },
  autopilot: { on: false }, rotorRPM: 1, collective: 0.4, torque: 0.5, stalled: false, canopy: 0,
  getVisualState() { return { canopy: this.canopy, engines: this.engines.map((e) => ({ n1: e.n1, afterburner: e.afterburner, reverser: this.reverser })) }; },
};
window.__fake = flight;

const sliders = ['dist', 'azim', 'n1', 'ab', 'rev', 'tas', 'agl', 'vs', 'g', 'rotor', 'coll', 'gear', 'flaps', 'sb', 'spoil', 'brake', 'canopy'];
const S = {};
for (const k of sliders) {
  const el = $(k);
  const show = () => { S[k] = Number(el.value); el.nextElementSibling.textContent = S[k].toFixed(el.step && el.step < 1 ? 2 : 0); };
  el.addEventListener('input', show); show();
}
const setS = (k, v) => { const el = $(k); el.value = v; el.dispatchEvent(new Event('input')); };
window.__set = setS;

for (const w of Object.keys(flight.warnings)) {
  const b = document.createElement('button'); b.textContent = w;
  b.onclick = () => { flight.warnings[w] = !flight.warnings[w]; b.classList.toggle('on', flight.warnings[w]); if (w === 'stall') flight.stalled = flight.warnings[w]; };
  $('warn').appendChild(b);
}

let current = null;
async function load(id) {
  current = id;
  await audio.loadAircraft(id);
  const prof = (await import(`../src/audio/profiles/${id}.js`)).default;
  const box = $('shots'); box.innerHTML = '';
  const names = [...Object.keys(prof.shots || {}), 'chime', 'click', 'apDisconnect', 'boom',
    ...(prof.alerts?.rules || []).filter((r) => r.voice).map((r) => r.id), ...(prof.alerts?.callouts || []).map((c) => String(c.ft)),
    ...(prof.alerts?.retard ? ['retard'] : [])];
  for (const n of names) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => audio.play(n); box.appendChild(b); }
  try { flight.spec = (await import(`../src/aircraft/${id}/spec.js`)).default; } catch { flight.spec = {}; }
  if (!flight.spec.flapDetents) flight.spec.flapDetents = [{ label: 'UP' }, { label: '1' }, { label: '2' }, { label: '3' }, { label: 'FULL' }];
  n1Idle = flight.spec.engine?.n1Idle ?? (id === 'uh60' ? 0.63 : 0.2);
  n1 = n1Idle;
  const nE = prof.engines || 1;
  flight.engines.length = 0;
  for (let i = 0; i < nE; i++) flight.engines.push({ n1: 0.2, thrust: 0, afterburner: 0 });
}
$('start').onclick = async () => { audio.start(); if (!current) await load($('ac').value); };
$('ac').onchange = () => load($('ac').value);
$('mute').onchange = (e) => audio.setMuted(e.target.checked);
$('pause').onchange = (e) => audio.setPaused(e.target.checked);
$('gearCycle').onclick = () => { gearTarget = S.gear > 0.5 ? 0 : 1; };
$('flapStep').onclick = () => { flapTarget = Math.min(1, flapTarget + 0.25); flight.flapsIndex = Math.round(flapTarget * 4); };
$('flapUp').onclick = () => { flapTarget = 0; flight.flapsIndex = 0; };
$('canopyCycle').onclick = () => { canopyTarget = S.canopy > 0.5 ? 0 : 1; };
let gearTarget = null, flapTarget = 0, canopyTarget = null, n1Idle = 0.2, n1 = 0.2;
window.__load = load;

// ---- scenarios ----
let sc = null, scT = 0;
const SC = {
  takeoff(t) {
    $('ground').checked = t < 32;
    setS('n1', t < 3 ? t * 0.3 : 1); setS('ab', current === 'f16' || current === 'f22' ? (t > 4 && t < 40 ? 1 : 0) : 0);
    setS('tas', Math.min(95, Math.max(0, (t - 3) * 3.2))); setS('agl', t < 32 ? 0 : (t - 32) * 12); setS('vs', t < 32 ? 0 : 12);
    if (t > 38) setS('gear', Math.max(0, 1 - (t - 38) / 7));
    return t < 60;
  },
  approach(t) {
    const agl = Math.max(0, 800 - t * 4.2);
    $('ground').checked = agl <= 0.01;
    setS('agl', agl); setS('vs', agl > 0 ? -4.2 : 0); setS('gear', 1); setS('flaps', 1); flight.flapsIndex = 4;
    const tdT = 800 / 4.2;
    setS('tas', agl > 0 ? 72 : Math.max(0, 72 - (t - tdT) * 2.6));
    setS('n1', agl > 12 ? 0.45 : t < tdT + 2 ? 0 : t < tdT + 15 ? 0.7 : 0);
    setS('rev', t > tdT + 1.5 && t < tdT + 16 ? 1 : 0); setS('spoil', t > tdT + 0.5 ? 1 : 0);
    setS('brake', t > tdT + 3 ? 0.8 : 0);
    return t < tdT + 30;
  },
  flyby(t) {
    $('cam').value = 'static'; setS('tas', 160); setS('n1', 0.85); setS('agl', 150); $('ground').checked = false; return t < 45;
  },
  super(t) {
    $('cam').value = 'static'; setS('tas', 480); setS('n1', 1); setS('ab', 1); setS('agl', 300); $('ground').checked = false; return t < 45;
  },
  ab(t) { setS('n1', t < 1 ? 0.3 : 1); setS('ab', t > 4 && t < 10 ? 1 : 0); return t < 13; },
};
const runSc = (name) => { sc = name; scT = 0; if (name === 'flyby' || name === 'super') resetFlyby(); };
$('scTakeoff').onclick = () => runSc('takeoff');
$('scApproach').onclick = () => runSc('approach');
$('scFlyby').onclick = () => runSc('flyby');
$('scSuper').onclick = () => runSc('super');
$('scAB').onclick = () => runSc('ab');
$('scStop').onclick = () => { sc = null; };
window.__scenario = runSc;

// flyby path: along -Z (heading north), passing the static camera at x = 120 m lateral offset
let flyZ = 4000;
function resetFlyby() { flyZ = 4000; }

// ---- loop ----
let last = performance.now();
const spec = $('spec'), sctx = spec.getContext('2d');
let fbuf = null;
function frame() {
  requestAnimationFrame(frame);
  const tNow = performance.now();
  const dt = Math.min(0.1, (tNow - last) / 1000); last = tNow;
  if (sc) { scT += dt; if (!SC[sc](scT)) sc = null; }
  if (gearTarget != null) { const v = S.gear + Math.sign(gearTarget - S.gear) * dt / 6; setS('gear', gearTarget ? Math.min(1, v) : Math.max(0, v)); if (S.gear === gearTarget) gearTarget = null; }
  if (Math.abs(flapTarget - S.flaps) > 0.001) setS('flaps', S.flaps + Math.sign(flapTarget - S.flaps) * Math.min(Math.abs(flapTarget - S.flaps), dt / 8));
  if (canopyTarget != null) { const v = S.canopy + Math.sign(canopyTarget - S.canopy) * dt / 4; setS('canopy', canopyTarget ? Math.min(1, v) : Math.max(0, v)); if (S.canopy === canopyTarget) canopyTarget = null; }
  // flight state
  const f = flight;
  const n1T = current === 'uh60' ? 0.63 + 0.37 * Math.pow(S.coll, 0.6) : n1Idle + (1 - n1Idle) * S.n1;
  n1 = $('spool').checked ? n1 + (n1T - n1) * (1 - Math.exp(-dt / (n1T > n1 ? 1.1 : 1.6))) : n1T;
  f.throttle = current === 'uh60' ? S.coll : S.n1; for (const e of f.engines) { e.n1 = n1; e.afterburner = S.ab; }
  f.reverser = S.rev; f.airspeed = S.tas; f.ias = S.tas * Math.exp(-S.agl / 16000); f.mach = S.tas / 340; f.agl = S.agl; f.altitude = S.agl;
  f.verticalSpeed = S.vs; f.gForce = S.g; f.onGround = $('ground').checked; f.crashed = $('crash').checked; f.gear = S.gear; f.flaps = S.flaps;
  f.speedbrake = S.sb; f.spoilers = S.spoil; f.brakes = S.brake; f.canopy = S.canopy; f.rotorRPM = S.rotor; f.collective = S.coll; f.torque = S.coll;
  f.autopilot.on = $('ap').checked;
  // aircraft pose & camera
  const mode = $('cam').value;
  if (mode === 'static') {
    flyZ -= S.tas * dt;
    if (flyZ < -4000) flyZ = 4000;
    plane.position.set(0, S.agl, flyZ);
    plane.quaternion.identity();
    camera.position.set(120, 2, 0);
    camera.lookAt(plane.position);
  } else {
    plane.position.set(0, S.agl, 0);
    plane.quaternion.identity();
    const a = S.azim * Math.PI / 180, d = mode === 'cockpit' ? 0.5 : S.dist;
    camera.position.set(Math.sin(a) * d, S.agl + (mode === 'cockpit' ? 1 : d * 0.15), -Math.cos(a) * d);
    camera.lookAt(plane.position);
  }
  f.position.copy(plane.position); f.quaternion.copy(plane.quaternion);
  f.velocity.set(0, S.vs, -S.tas);
  plane.updateMatrixWorld(); camera.updateMatrixWorld();
  audio.update(dt, f, { view: mode === 'cockpit' ? 'cockpit' : 'exterior', aircraftObject: plane, camera });
  draw();
}
let dbgT = 0;
function draw() {
  const an = audio.analyser;
  if (!an) return;
  if (!fbuf) fbuf = new Float32Array(an.frequencyBinCount);
  an.getFloatFrequencyData(fbuf);
  const W = spec.width, H = spec.height, sr = audio.context.sampleRate;
  sctx.fillStyle = '#0b1016'; sctx.fillRect(0, 0, W, H);
  sctx.strokeStyle = '#223'; sctx.fillStyle = '#567'; sctx.font = '11px sans-serif';
  for (const f of [30, 100, 300, 1000, 3000, 10000]) { const x = Math.log(f / 20) / Math.log(1000) * W; sctx.beginPath(); sctx.moveTo(x, 0); sctx.lineTo(x, H); sctx.stroke(); sctx.fillText(f >= 1000 ? f / 1000 + 'k' : f, x + 2, 12); }
  sctx.strokeStyle = '#6cf'; sctx.beginPath();
  for (let i = 1; i < fbuf.length; i++) {
    const fr = i * sr / 2 / fbuf.length; if (fr < 20) continue;
    const x = Math.log(fr / 20) / Math.log(1000) * W, y = H * (1 - (fbuf[i] + 110) / 100);
    if (i === 1) sctx.moveTo(x, y); else sctx.lineTo(x, y);
  }
  sctx.stroke();
  if ((dbgT += 1) % 10 === 0) {
    const d = audio.debug();
    $('meter').textContent = `ctx ${d.state}  RMS ${d.rmsDb} dBFS  tepe ${d.peakDb} dBFS  ses: ${d.voice ?? '-'}  idleN1 ${d.idleN1?.toFixed?.(2)}`;
    $('dbg').textContent = d.emitters.map((e) => `${e.name.padEnd(6)} d ${String(e.d).padStart(7)}  gecikme ${e.delay.toFixed(3)}  cos ${e.cos}  koni ${e.inside}`).join('\n') + '\n\n'
      + d.layers.filter((l) => l.g > 0.0005).map((l) => `${l.id.padEnd(16)} g ${l.g.toFixed(3)}  hız ${l.rate.toFixed(2)}  dış ${l.ext.toFixed(2)}  iç ${l.int.toFixed(2)}${l.loaded ? '' : '  (yükleniyor)'}`).join('\n');
  }
}
requestAnimationFrame(frame);

// ---- recorder (dev/automation): taps the master output, returns a 16-bit stereo WAV as base64 ----
window.__rec = (() => {
  let node = null, chunks = [], n = 0;
  return {
    start() {
      const ctx = audio.context; chunks = []; n = 0;
      node = ctx.createScriptProcessor(4096, 2, 2);
      node.onaudioprocess = (ev) => { const b = ev.inputBuffer; chunks.push([b.getChannelData(0).slice(), b.getChannelData(1).slice()]); n += b.length; };
      audio.output.connect(node); node.connect(ctx.destination);
      return true;
    },
    stop() {
      if (!node) return null;
      audio.output.disconnect(node); node.disconnect(); node = null;
      const sr = audio.context.sampleRate, buf = new ArrayBuffer(44 + n * 4), dv = new DataView(buf);
      const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
      w(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
      dv.setUint16(22, 2, true); dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true);
      w(36, 'data'); dv.setUint32(40, n * 4, true);
      let o = 44;
      for (const [l, r] of chunks) for (let i = 0; i < l.length; i++) {
        dv.setInt16(o, Math.max(-1, Math.min(1, l[i])) * 32767, true); dv.setInt16(o + 2, Math.max(-1, Math.min(1, r[i])) * 32767, true); o += 4;
      }
      let bin = ''; const u8 = new Uint8Array(buf);
      for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
      return btoa(bin);
    },
  };
})();
window.__ready = () => { const d = audio.debug(); return d.state === 'running' && d.layers.length > 0 && d.layers.every((l) => l.loaded); };
const qp = new URLSearchParams(location.search);
if (qp.get('ac')) { $('ac').value = qp.get('ac'); }
if (qp.get('cam')) { $('cam').value = qp.get('cam'); }
// headless/automation: ?auto=1 starts on the first click anywhere
document.addEventListener('pointerdown', () => { if (!current) { audio.start(); load($('ac').value); } }, { once: true });
</script>
</body>
</html>
